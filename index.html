<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>IDEAL Ofertas & Pedidos</title>

  <meta name="theme-color" content="#e30613">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IDEAL Ofertas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="IDEAL Ofertas & Pedidos">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f6f6;font-family:Arial,Helvetica,sans-serif}
    #appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    #installBar{
      display:none; position:fixed; left:10px; right:10px;
      bottom:calc(10px + env(safe-area-inset-bottom));
      z-index:99999; background:#fff; border:1px solid #e6e6e6;
      border-radius:16px; box-shadow:0 12px 32px rgba(0,0,0,.22);
      padding:10px 11px; align-items:center; gap:10px;
    }
    #installText{flex:1;min-width:0}
    #installText strong{display:block;font-size:13px;color:#222}
    #installText span{display:block;font-size:10px;color:#777;margin-top:2px;line-height:1.3}
    #btnInstall{
      border:0;border-radius:10px;background:#e30613;color:#fff;
      min-height:44px;padding:9px 14px;font-weight:800;cursor:pointer
    }
    #btnClose{
      width:42px;height:42px;border:0;border-radius:10px;
      background:#f1f1f1;color:#444;font-size:22px;cursor:pointer
    }
    #iosHelp{
      display:none;position:fixed;left:10px;right:10px;
      bottom:calc(10px + env(safe-area-inset-bottom));
      z-index:100000;background:#fff;border:1px solid #e6e6e6;
      border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.22);
      padding:14px;font-size:12px;line-height:1.45;color:#444
    }
    #loading{
      position:fixed;inset:0;z-index:99998;background:#e30613;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      color:#fff;text-align:center;padding:30px;transition:opacity .25s ease
    }
    #loading img{width:128px;height:128px;border-radius:28px;object-fit:cover;margin-bottom:14px}
    #loading strong{font-size:20px}
    #loading span{font-size:12px;opacity:.9;margin-top:4px}

    /* MASTER 9.7.2 — NOTIFICAÇÕES PUSH */
    #pushBox{
      position:fixed;
      top:calc(10px + env(safe-area-inset-top));
      right:10px;
      z-index:100002;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:6px;
      pointer-events:none;
    }

    #btnPush{
      pointer-events:auto;
      border:0;
      border-radius:999px;
      min-height:42px;
      padding:9px 14px;
      background:#fff;
      color:#222;
      box-shadow:0 6px 20px rgba(0,0,0,.20);
      font-weight:800;
      font-size:12px;
      cursor:pointer;
      border:1px solid #e7e7e7;
    }

    #btnPush.ativo{
      background:#e8f6ed;
      color:#176b38;
      border-color:#bfe4ca;
    }

    #btnPush.bloqueado{
      background:#fff1f1;
      color:#9c1b24;
      border-color:#f1c7cb;
    }

    #pushMsg{
      display:none;
      pointer-events:none;
      max-width:min(320px,calc(100vw - 20px));
      background:#222;
      color:#fff;
      border-radius:10px;
      padding:8px 10px;
      font-size:10px;
      line-height:1.35;
      box-shadow:0 6px 20px rgba(0,0,0,.20);
    }

    #pushToast{
      display:none;
      position:fixed;
      left:10px;
      right:10px;
      top:calc(62px + env(safe-area-inset-top));
      z-index:100003;
      max-width:520px;
      margin:0 auto;
      background:#fff;
      color:#222;
      border-left:5px solid #ed0013;
      border-radius:12px;
      box-shadow:0 10px 28px rgba(0,0,0,.22);
      padding:11px 13px;
      font-size:12px;
      line-height:1.4;
    }

    #pushToast strong{
      display:block;
      margin-bottom:3px;
      color:#ed0013;
    }

    @media(display-mode:standalone){#installBar,#iosHelp{display:none!important}}
  
/* ==========================================================
   MASTER 9.7.7.8 — SPLASH OFICIAL IDEAL OFERTAS
   Carrinho original entra da DIREITA para a ESQUERDA.
   Ao parar, a marca original se completa e aparece
   "Ofertas e Pedidos".
   ========================================================== */

body.idealSplashAberta #pushBox,
body.idealSplashAberta #pushToast,
body.idealSplashAberta #installBar,
body.idealSplashAberta #iosHelp{
  opacity:0!important;
  visibility:hidden!important;
  pointer-events:none!important;
}

#idealSplashAnimado{
  position:fixed;
  inset:0;
  z-index:200010;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%, #f80b20 0%, #ed0013 48%, #d90012 100%);
  opacity:1;
  visibility:visible;
  transition:opacity .48s ease,visibility .48s ease;
}

#idealSplashAnimado.oculto{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.ideal-splash-oficial{
  width:min(91vw,480px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transform:translateY(-1.5vh);
}

.ideal-logo-stage{
  position:relative;
  width:100%;
  aspect-ratio:926 / 346;
}

.ideal-logo-final{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  opacity:0;
  transform:scale(.985);
  filter:
    drop-shadow(0 8px 10px rgba(110,0,0,.24))
    drop-shadow(0 0 10px rgba(255,214,0,.08));
  animation:
    idealLogoCompleta .52s ease 1.48s forwards;
}

.ideal-cart-original{
  position:absolute;
  left:0;
  top:0;
  width:42.333%;
  height:100%;
  object-fit:contain;
  object-position:left center;
  z-index:2;
  filter:
    drop-shadow(0 9px 9px rgba(90,0,0,.28))
    drop-shadow(0 0 8px rgba(255,215,0,.22));
  transform:translateX(calc(100vw + 120px));
  animation:
    idealCarrinhoDireitaEsquerda 1.28s cubic-bezier(.14,.76,.18,1) .12s forwards,
    idealCarrinhoEncaixe .22s ease 1.40s forwards,
    idealCarrinhoIntegra .28s ease 1.60s forwards;
}

.ideal-rastro{
  position:absolute;
  right:8%;
  top:45%;
  width:62%;
  height:4px;
  border-radius:999px;
  opacity:0;
  background:
    linear-gradient(
      90deg,
      rgba(255,217,0,0),
      rgba(255,217,0,.22),
      rgba(255,217,0,.85),
      rgba(255,255,255,.92)
    );
  box-shadow:
    0 -22px 0 rgba(255,190,0,.22),
    0 22px 0 rgba(255,190,0,.18);
  animation:
    idealRastroPassa 1.15s ease .14s both;
}

.ideal-ofertas-pedidos{
  margin-top:18px;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(22px,6.2vw,34px);
  line-height:1.1;
  font-weight:800;
  letter-spacing:.2px;
  text-align:center;
  opacity:0;
  transform:translateY(14px);
  text-shadow:0 4px 12px rgba(110,0,0,.24);
  animation:
    idealFraseAparece .48s ease 2.02s forwards;
}

@keyframes idealCarrinhoDireitaEsquerda{
  0%{
    transform:translateX(calc(100vw + 120px)) scale(.97);
  }
  72%{
    transform:translateX(-13px) scale(1.025);
  }
  100%{
    transform:translateX(0) scale(1);
  }
}

@keyframes idealCarrinhoEncaixe{
  0%{
    transform:translateX(0);
  }
  45%{
    transform:translateX(5px);
  }
  100%{
    transform:translateX(0);
  }
}

@keyframes idealCarrinhoIntegra{
  from{opacity:1}
  to{opacity:0}
}

@keyframes idealLogoCompleta{
  from{
    opacity:0;
    transform:scale(.985);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes idealRastroPassa{
  0%{
    opacity:0;
    transform:translateX(44vw) scaleX(.42);
  }
  22%{
    opacity:.92;
  }
  74%{
    opacity:.66;
  }
  100%{
    opacity:0;
    transform:translateX(-16vw) scaleX(1);
  }
}

@keyframes idealFraseAparece{
  from{
    opacity:0;
    transform:translateY(14px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* O carregamento antigo fica discreto e não mostra ícone cortado. */
#loading{
  background:#ed0013;
}
#loading img{
  display:none!important;
}
#loading strong,
#loading span{
  color:#fff;
}


/* MASTER 9.7.7.9 — OCULTA ABA/BOTÃO DE NOTIFICAÇÕES, MANTÉM PUSH ATIVO */
#pushBox {
  display: none !important;
}

</style>

  <script>
    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loading');

    frame.addEventListener('load', () => {
      setTimeout(() => {
        loading.style.opacity = '0';
        setTimeout(() => loading.style.display = 'none', 260);
      }, 500);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js?v=981', { scope: './', updateViaCache: 'none' })
          .then(reg => console.log('IDEAL PWA ativo:', reg.scope))
          .catch(err => console.error('Erro Service Worker:', err));
      });
    }

    let deferredPrompt = null;
    const bar = document.getElementById('installBar');
    const btnInstall = document.getElementById('btnInstall');
    const btnClose = document.getElementById('btnClose');
    const iosHelp = document.getElementById('iosHelp');

    const isStandalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredPrompt = event;

      if (!isStandalone && localStorage.getItem('idealPwaBarFechada') !== '1') {
        bar.style.display = 'flex';
      }
    });

    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        bar.style.display = 'none';
        await deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        return;
      }

      const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
      if (isiOS) {
        iosHelp.style.display = 'block';
        setTimeout(() => iosHelp.style.display = 'none', 9000);
      } else {
        alert('Abra o menu do navegador e escolha "Instalar app" ou "Adicionar à tela inicial".');
      }
    });

    btnClose.addEventListener('click', () => {
      localStorage.setItem('idealPwaBarFechada', '1');
      bar.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      localStorage.removeItem('idealPwaBarFechada');
      bar.style.display = 'none';
      deferredPrompt = null;
    });
  </script>

     * por handshake, evitando problemas com iframes intermediários.
     */
    let ponteAppsScriptWindow = null;
    let ponteAppsScriptOrigin = '';
    let ponteAppsScriptPronta = false;

    function mostrarMensagemPush(texto, tempo = 6000){
      pushMsg.textContent = texto;
      pushMsg.style.display = 'block';

      window.clearTimeout(
        window.__idealPushMsgTimer
      );

      window.__idealPushMsgTimer =
        window.setTimeout(() => {
          pushMsg.style.display = 'none';
        }, tempo);
    }

    function mostrarToastPush(payload){
      const notification =
        payload?.notification || {};

      const data =
        payload?.data || {};

      pushToastTitle.textContent =
        notification.title ||
        data.title ||
        'IDEAL Supermercados';

      pushToastBody.textContent =
        notification.body ||
        data.body ||
        'Você recebeu uma nova atualização.';

      pushToast.style.display = 'block';

      window.clearTimeout(
        window.__idealPushToastTimer
      );

      window.__idealPushToastTimer =
        window.setTimeout(() => {
          pushToast.style.display = 'none';
        }, 7000);
    }

    function obterIdDispositivo(){
      let id =
        localStorage.getItem(
          'idealPushDeviceId'
        ) || '';

      if(id){
        return id;
      }

      if(
        window.crypto &&
        typeof window.crypto.randomUUID === 'function'
      ){
        id = window.crypto.randomUUID();
      }else{
        id =
          'ideal-' +
          Date.now().toString(36) +
          '-' +
          Math.random()
            .toString(36)
            .slice(2, 12);
      }

      localStorage.setItem(
        'idealPushDeviceId',
        id
      );

      return id;
    }

    function plataformaAtual(){
      try{
        if(
          navigator.userAgentData &&
          navigator.userAgentData.platform
        ){
          return String(
            navigator.userAgentData.platform
          );
        }
      }catch(_){}

      return String(
        navigator.platform ||
        'WEB/PWA'
      );
    }

    function origemGoogleValida(origin){
      try{
        const host =
          new URL(origin).hostname;

        return (
          host === 'script.google.com' ||
          host === 'script.googleusercontent.com' ||
          host.endsWith('.googleusercontent.com')
        );
      }catch(_){
        return false;
      }
    }

    function atualizarBotaoPush(){
      const permissao =
        ('Notification' in window)
          ? Notification.permission
          : 'unsupported';

      const token =
        localStorage.getItem(
          'idealFcmToken'
        ) || '';

      btnPush.classList.remove(
        'ativo',
        'bloqueado'
      );

      if(
        permissao === 'granted' &&
        token
      ){
        btnPush.textContent =
          '🔔 Notificações ativas';

        btnPush.classList.add('ativo');

        return;
      }

      if(permissao === 'denied'){
        btnPush.textContent =
          '🔕 Notificações bloqueadas';

        btnPush.classList.add(
          'bloqueado'
        );

        return;
      }

      btnPush.textContent =
        permissao === 'granted'
          ? '🔔 Concluir notificações'
          : '🔔 Ativar notificações';
    }

    function obterUltimoPedidoPush(){
      try{
        const bruto =
          localStorage.getItem(
            'ideal_fm4_ultimo_pedido_v1'
          );

        if(!bruto){
          return {
            telefone: '',
            idPedido: ''
          };
        }

        const pedido =
          JSON.parse(bruto) || {};

        return {
          telefone:
            String(
              pedido.telefone ||
              (
                pedido.cliente &&
                pedido.cliente.telefone
              ) ||
              ''
            )
            .replace(/\D/g, ''),

          idPedido:
            String(
              pedido.idPedido || ''
            ).trim()
        };

      }catch(err){
        console.warn(
          '[IDEAL Push 9.7.7.2] Não foi possível ler o último pedido local:',
          err
        );

        return {
          telefone: '',
          idPedido: ''
        };
      }
    }

    function enviarTokenAoAppsScript(token){
      if(
        !token ||
        !ponteAppsScriptPronta ||
        !ponteAppsScriptWindow ||
        !ponteAppsScriptOrigin
      ){
        return false;
      }

      ponteAppsScriptWindow.postMessage(
        {
          type:
            'IDEAL_PUSH_REGISTRAR_TOKEN',

          payload: {
            idDispositivo:
              obterIdDispositivo(),

            tokenFcm:
              token,

            plataforma:
              plataformaAtual(),

            userAgent:
              navigator.userAgent || '',

            origem:
              'IDEAL_OFERTAS_PWA_GITHUB',

            telefone:
              obterUltimoPedidoPush()
                .telefone,

            idPedido:
              obterUltimoPedidoPush()
                .idPedido

        },
        ponteAppsScriptOrigin
      );

      ultimoTokenEnviado = token;

      console.log(
        '[IDEAL Push 9.7.7.2] Token enviado para a ponte Apps Script.'
      );

      return true;
    }

    function cadastrarTokenComTentativas(
      token
    ){
      if(!token){
        return;
      }

      const tentativas =
        [0, 1000, 2500, 5000, 9000];

      tentativas.forEach(tempo => {
        window.setTimeout(() => {
          if(
            tokenConfirmadoBackend ===
            token
          ){
            return;
          }

          enviarTokenAoAppsScript(
            token
          );
        }, tempo);
      });
    }

    window.addEventListener(

            event.origin

          tokenConfirmadoBackend =
            token;

          localStorage.setItem(
            'idealPushTokenSalvoNaPlanilha',
            token
          );

          localStorage.setItem(
            'idealPushTokenSalvoEm',
            new Date().toISOString()
          );

          console.log(
            '[IDEAL Push 9.7.7.2] Token confirmado na planilha:',
            mensagem.resultado
          );

          mostrarMensagemPush(
            '✅ Dispositivo cadastrado para receber notificações.',
            5000
          );

          return;
        }

        console.warn(
          '[IDEAL Push 9.7.7.2] Apps Script não salvou o token:',
          mensagem.erro ||
          'erro desconhecido'
        );

        mostrarMensagemPush(
          'Não foi possível concluir o cadastro Push: ' +
          (
            mensagem.erro ||
            'erro desconhecido'
          ),
          9000
        );
      }
    );

    async function obterTokenFcm({
      pedirPermissao = false,
      mostrarSucesso = false
    } = {}){
      if(
        !('Notification' in window) ||
        !('serviceWorker' in navigator)
      ){
        throw new Error(
          'Este navegador não oferece suporte às notificações necessárias.'
        );
      }

      const suportado =
        await isSupported();

      if(!suportado){
        throw new Error(
          'Firebase Messaging não é compatível com este navegador.'
        );
      }

      let permissao =
        Notification.permission;

      if(
        pedirPermissao &&
        permissao !== 'granted'
      ){
        permissao =
          await Notification.requestPermission();
      }

      if(permissao !== 'granted'){
        atualizarBotaoPush();

        if(pedirPermissao){
          mostrarMensagemPush(
            permissao === 'denied'
              ? 'As notificações estão bloqueadas nas permissões do navegador.'
              : 'A permissão para notificações não foi concedida.'
          );
        }

        return '';
      }

      const registration =
        await navigator.serviceWorker.register(
          IDEAL_SW_URL,
          {
            scope: './',
            updateViaCache: 'none'
          }
        );

      try{
        await registration.update();
      }catch(_){}

      const swRegistration =
        registration.active
          ? registration
          : await navigator.serviceWorker.ready;

      /*
       * MASTER 9.7.3:
       * para registrar/enviar Push ao dispositivo usamos o
       * FCM REGISTRATION TOKEN, validado no teste de background.
       */
      const token =
        await getToken(
          messaging,
          {
            vapidKey:
              VAPID_PUBLIC_KEY,

            serviceWorkerRegistration:
              swRegistration
          }
        );

      if(!token){
        throw new Error(
          'O Firebase não retornou o token FCM do aparelho.'
        );
      }

      localStorage.setItem(
        'idealFcmToken',
        token
      );

      localStorage.setItem(
        'idealFcmTokenAtualizadoEm',
        new Date().toISOString()
      );

      localStorage.setItem(
        'idealPushVersion',
        IDEAL_PUSH_VERSION
      );

      atualizarBotaoPush();

      cadastrarTokenComTentativas(
        token
      );

      if(mostrarSucesso){
        mostrarMensagemPush(
          '✅ Notificações ativadas com sucesso.'
        );
      }

      return token;
    }

    async function iniciarPush(){
      btnPush.disabled = true;
      btnPush.textContent =
        'Ativando...';

      try{
        await obterTokenFcm({
          pedirPermissao: true,
          mostrarSucesso: true
        });

      }catch(err){
        console.error(
          '[IDEAL Push 9.7.3] Erro:',
          err
        );

        const detalhe =
          err &&
          (err.code || err.message)
            ? String(
                err.code ||
                err.message
              )
            : 'erro desconhecido';

        mostrarMensagemPush(
          'Não foi possível ativar as notificações. Detalhe: ' +
          detalhe,
          12000
        );

      }finally{
        btnPush.disabled = false;
        atualizarBotaoPush();
      }
    }

    btnPush.addEventListener(
      'click',
      async () => {
        if(
          Notification.permission ===
          'granted'
        ){
          try{
            const token =
              await obterTokenFcm({
                pedirPermissao: false,
                mostrarSucesso: false
              });

            if(token){
              mostrarMensagemPush(
                '✅ Notificações já estão ativas.'
              );
            }
          }catch(err){
            console.error(
              '[IDEAL Push] Falha ao atualizar token:',
              err
            );

            mostrarMensagemPush(
              'Não foi possível atualizar o cadastro das notificações.',
              9000
            );
          }

          return;
        }

        await iniciarPush();
      }
    );

    /*
     * Se o iframe do Apps Script carregar depois do token,
     * tentamos novamente o cadastro.
     */
    appFramePush.addEventListener(
      'load',
      () => {
        /*
         * O Apps Script vai enviar IDEAL_PUSH_BRIDGE_READY
         * quando sua página interna estiver realmente pronta.
         */
        ponteAppsScriptWindow = null;
        ponteAppsScriptOrigin = '';
        ponteAppsScriptPronta = false;

        console.log(
          '[IDEAL Push 9.7.7.2] Iframe carregado; aguardando handshake.'
        );
      }
    );

    /*
     * Mensagem recebida com o PWA aberto.
     */
    onMessage(
      messaging,
      payload => {
        console.log(
          '[IDEAL Push] Mensagem em primeiro plano:',
          payload
        );

        mostrarToastPush(
          payload
        );
      }
    );

    /*
     * Também aceita mensagens encaminhadas pelo Service Worker.
     */
    if('serviceWorker' in navigator){
      navigator.serviceWorker.addEventListener(
        'message',
        event => {
          const mensagem =
            event.data || {};

          if(
            mensagem.type !==
            'IDEAL_PUSH'
          ){
            return;
          }

          mostrarToastPush(
            mensagem.payload || {}
          );
        }
      );
    }

    atualizarBotaoPush();

    /*
     * Cadastro automático:
     * se o cliente já autorizou notificações, o PWA obtém/renova
     * o token FCM ao abrir e envia para a planilha sem pedir nada.
     */
    if(
      'Notification' in window &&
      Notification.permission ===
      'granted'
    ){
      window.setTimeout(
        async () => {
          try{
            await obterTokenFcm({
              pedirPermissao: false,
              mostrarSucesso: false
            });
          }catch(err){
            console.warn(
              '[IDEAL Push 9.7.3] Cadastro automático pendente:',
              err
            );
          }
        },
        1200
      );
    }
  </script>


<script>
/* ==========================================================
   MASTER 9.7.7.8 — CONTROLE DA SPLASH OFICIAL
   ========================================================== */
(function(){
  const splash =
    document.getElementById(
      'idealSplashAnimado'
    );

  if(!splash){
    document.body.classList.remove(
      'idealSplashAberta'
    );
    return;
  }

  let fechada = false;

  function fecharSplashIdeal(){
    if(fechada){
      return;
    }

    fechada = true;

    splash.classList.add(
      'oculto'
    );

    document.body.classList.remove(
      'idealSplashAberta'
    );

    window.setTimeout(
      function(){
        splash.style.display =
          'none';
      },
      520
    );
  }

  /*
   * Sequência:
   * 1) carrinho original entra da direita para a esquerda;
   * 2) para e encaixa na marca;
   * 3) IDEAL Supermercados completa;
   * 4) aparece "Ofertas e Pedidos";
   * 5) abre o aplicativo.
   */
  window.setTimeout(
    fecharSplashIdeal,
    3500
  );

  /* Segurança para nunca prender a abertura. */
  window.setTimeout(
    fecharSplashIdeal,
    4800
  );

  window.fecharSplashIdeal =
    fecharSplashIdeal;
})();
</script>
