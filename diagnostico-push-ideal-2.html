<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Diagnóstico Push IDEAL 2</title>
  <style>
    body{
      margin:0;
      padding:18px;
      font-family:Arial,sans-serif;
      background:#f4f4f4;
      color:#222;
    }
    .box{
      max-width:820px;
      margin:auto;
      padding:20px;
      border-radius:16px;
      background:#fff;
      box-shadow:0 4px 16px rgba(0,0,0,.12);
    }
    h1{font-size:22px;margin-top:0}
    button{
      border:0;
      border-radius:10px;
      padding:13px 16px;
      margin:4px 4px 12px 0;
      font-weight:700;
      cursor:pointer;
    }
    #ler{background:#d71920;color:#fff}
    #limpar{background:#ddd;color:#222}
    pre{
      white-space:pre-wrap;
      word-break:break-word;
      background:#111;
      color:#fff;
      padding:14px;
      border-radius:10px;
      min-height:220px;
      line-height:1.45;
      font-size:13px;
    }
  </style>
</head>
<body>
<div class="box">
  <h1>Diagnóstico Push — IDEAL 9.7.2.10</h1>
  <p>
    Esta tela mostra se o Service Worker recebeu o Push enquanto
    o aplicativo estava em segundo plano.
  </p>

  <button id="ler">Ler diagnóstico</button>
  <button id="limpar">Limpar logs</button>

  <pre id="saida">Toque em “Ler diagnóstico”.</pre>
</div>

<script>
const DB = 'idealPushDiagnostico';
const STORE = 'eventos';
const saida = document.getElementById('saida');

function abrirDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB, 1);

    req.onupgradeneeded = () => {
      const db = req.result;

      if(!db.objectStoreNames.contains(STORE)){
        db.createObjectStore(
          STORE,
          {keyPath:'id', autoIncrement:true}
        );
      }
    };

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function ler(){
  const linhas = [];

  try{
    linhas.push('=== IDEAL PUSH DIAGNÓSTICO 9.7.2.10 ===');
    linhas.push('Data: ' + new Date().toLocaleString('pt-BR'));
    linhas.push('Permissão: ' + (
      'Notification' in window
        ? Notification.permission
        : 'API indisponível'
    ));

    linhas.push('');
    linhas.push('=== SERVICE WORKER ===');

    const regs =
      'serviceWorker' in navigator
        ? await navigator.serviceWorker.getRegistrations()
        : [];

    linhas.push('Registros encontrados: ' + regs.length);

    for(let i=0;i<regs.length;i++){
      const r = regs[i];

      if(!r.scope.includes('/ideal-ofertas-pwa/')){
        continue;
      }

      linhas.push('Scope IDEAL: ' + r.scope);
      linhas.push(
        'Script ativo: ' +
        (r.active ? r.active.scriptURL : 'NENHUM')
      );

      const sub = await r.pushManager.getSubscription();

      linhas.push(
        'PushSubscription: ' +
        (sub ? 'SIM' : 'NÃO')
      );
    }

    linhas.push('');
    linhas.push('=== EVENTOS GRAVADOS ===');

    const db = await abrirDB();

    const eventos = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();

      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });

    db.close();

    if(!eventos.length){
      linhas.push('Nenhum evento gravado.');
    }else{
      eventos
        .slice(-50)
        .forEach(e => {
          const d = new Date(e.data);

          linhas.push('');
          linhas.push(
            '#' + e.id +
            ' | ' +
            d.toLocaleString('pt-BR') +
            ' | ' +
            e.tipo
          );

          if(e.detalhe){
            linhas.push(e.detalhe);
          }
        });
    }

    linhas.push('');
    linhas.push('=== COMO INTERPRETAR ===');
    linhas.push(
      'PUSH_RAW_RECEBIDO = o navegador acordou o Service Worker.'
    );
    linhas.push(
      'FCM_BACKGROUND_RECEBIDO = o Firebase processou a mensagem em segundo plano.'
    );
    linhas.push(
      'SHOW_NOTIFICATION_OK = o Service Worker pediu ao Android para mostrar a notificação.'
    );

    saida.textContent = linhas.join('\n');

  }catch(err){
    saida.textContent =
      'ERRO:\n' +
      String(err && (err.stack || err.message) || err);
  }
}

async function limpar(){
  try{
    const db = await abrirDB();

    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).clear();

      req.onsuccess = resolve;
      req.onerror = () => reject(req.error);
    });

    db.close();
    saida.textContent = 'Logs apagados.';
  }catch(err){
    saida.textContent = 'Erro ao limpar: ' + String(err);
  }
}

document.getElementById('ler').addEventListener('click', ler);
document.getElementById('limpar').addEventListener('click', limpar);
</script>
</body>
</html>
