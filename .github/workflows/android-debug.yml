name: Android Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Gerar web bundle
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Verificar Firebase Android
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERRO: envie native-android/google-services.json antes de gerar o APK."
            exit 1
          fi
          cp google-services.json android/app/google-services.json

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: IDEAL-Ofertas-Android-debug
          path: native-android/android/app/build/outputs/apk/debug/app-debug.apk
