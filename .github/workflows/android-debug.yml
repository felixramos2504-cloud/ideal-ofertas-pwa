name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'native-android/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Gerar web bundle
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Verificar Firebase Android
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERRO: envie native-android/google-services.json antes de gerar o APK."
            exit 1
          fi
          cp google-services.json android/app/google-services.json

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar ícone oficial IDEAL Ofertas
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("../icon-maskable-512.png")
          if not src.exists():
              raise SystemExit("Ícone fonte não encontrado: " + str(src))

          img = Image.open(src).convert("RGBA")

          tamanhos = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          base = Path("android/app/src/main/res")

          for pasta, tamanho in tamanhos.items():
              destino = base / pasta
              destino.mkdir(parents=True, exist_ok=True)

              icone = img.resize(
                  (tamanho, tamanho),
                  Image.Resampling.LANCZOS
              )

              icone.save(destino / "ic_launcher.png")
              icone.save(destino / "ic_launcher_round.png")

          # Remove o adaptive icon padrão do Capacitor para que
          # o Android use diretamente o ícone oficial do IDEAL.
          for nome in [
              "ic_launcher.xml",
              "ic_launcher_round.xml"
          ]:
              p = base / "mipmap-anydpi-v26" / nome
              if p.exists():
                  p.unlink()

          print("Ícones IDEAL gerados com sucesso.")
          PY

      - name: Configurar ícone das notificações Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          res = Path("android/app/src/main/res")
          drawable = res / "drawable"
          values = res / "values"
          drawable.mkdir(parents=True, exist_ok=True)
          values.mkdir(parents=True, exist_ok=True)

          # Small icon monocromático exigido pelo Android.
          (drawable / "ic_stat_ideal.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M6,7h12l-1,13H7L6,7zM9,7V5a3,3 0,0 1,6 0v2h-2V5a1,1 0,0 0,-2 0v2H9zM10,10h4v7h-4z"/>
          </vector>
          """, encoding="utf-8")

          colors = values / "colors.xml"
          if colors.exists():
              s = colors.read_text(encoding="utf-8")
              if "ideal_notification_color" not in s:
                  s = s.replace(
                      "</resources>",
                      '    <color name="ideal_notification_color">#D71920</color>\n</resources>'
                  )
                  colors.write_text(s, encoding="utf-8")
          else:
              colors.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <color name="ideal_notification_color">#D71920</color>\n'
                  '</resources>\n',
                  encoding="utf-8"
              )

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text(encoding="utf-8")

          meta = """
              <meta-data
                  android:name="com.google.firebase.messaging.default_notification_icon"
                  android:resource="@drawable/ic_stat_ideal" />
              <meta-data
                  android:name="com.google.firebase.messaging.default_notification_color"
                  android:resource="@color/ideal_notification_color" />
          """

          if "default_notification_icon" not in s:
              s = s.replace(
                  "</application>",
                  meta + "\n    </application>"
              )

          manifest.write_text(s, encoding="utf-8")
          print("Ícone pequeno de notificação configurado.")
          print(manifest.read_text(encoding="utf-8"))
          PY

      - name: Preparar assinatura fixa de teste
        run: |
          base64 -d ideal-debug.keystore.b64 > ideal-debug.keystore
          keytool -list -v -keystore ideal-debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:"

      - name: Forçar assinatura e versão no Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "versionCode 1",
              "versionCode 123"
          )

          s = s.replace(
              'versionName "1.0"',
              'versionName "1.2.3"'
          )

          marker = "    buildTypes {"

          signing = """    signingConfigs {
              idealDebugFixed {
                  storeFile file('../../ideal-debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
          }

          """

          if "idealDebugFixed" not in s:
              s = s.replace(
                  marker,
                  signing + marker
              )

          s = s.replace(
              "    buildTypes {\n",
              "    buildTypes {\n        debug {\n            signingConfig signingConfigs.idealDebugFixed\n        }\n",
              1
          )

          p.write_text(s)
          print(p.read_text())
          PY

      - name: Gerar APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: IDEAL-Ofertas-Android-debug
          path: native-android/android/app/build/outputs/apk/debug/app-debug.apk
